# Horizontal Pod Autoscalers for the stateless mx4 services.
# They scale on CPU usage relative to each container's CPU *request*, so they
# need metrics-server in the cluster (check with: kubectl top pods -n mx4).
# Not autoscaled: frontend (fixed at 1 replica), redis (holds data) and
# ngrok (one agent per domain).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: mx4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # The backend waits on long planner calls; shrink slowly so pods that
      # are holding open requests are not removed right after a burst.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mx4-quantic
  namespace: mx4
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mx4-quantic
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      # QAOA simulation is CPU-bound: add capacity quickly.
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
