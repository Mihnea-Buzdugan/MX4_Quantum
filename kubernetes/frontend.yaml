
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mx4
spec:
  # replicas: managed by the HorizontalPodAutoscaler in hpa.yaml
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: mx4-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          env:
            - name: HOST
              value: "0.0.0.0"
            # Override frontend/.env (localhost:8000) so the browser calls the API
            # on the same origin it loaded the page from (mx4.local or the ngrok
            # URL); the ingress sends /api to the backend.
            - name: VITE_API_URL
              value: ""
            - name: VITE_RAILWAY_PLANNER_URL
              value: /api/railway/plan
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mx4
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
  type: ClusterIP
