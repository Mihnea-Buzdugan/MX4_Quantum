
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mx4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mx4-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - manage.py
            - runserver
            - 0.0.0.0:8000
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: backend.settings
            - name: REDIS_URL
              value: redis://redis:6379/1
            - name: DEBUG
              value: "True"
            - name: ALLOWED_HOSTS
              value: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mx4
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
