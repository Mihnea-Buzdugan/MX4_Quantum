
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mx4
spec:
  # replicas: managed by the HorizontalPodAutoscaler in hpa.yaml
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mx4-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - manage.py
            - runserver
            - 0.0.0.0:8000
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: backend.settings
            - name: REDIS_URL
              value: redis://redis:6379/1
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DEBUG
              value: "True"
            - name: ALLOWED_HOSTS
              value: "*"
            # Overrides backend/.env (localhost:8001), which only works outside the
            # cluster. load_dotenv() never overwrites variables that are already set.
            - name: RAILWAY_PLANNER_URL
              value: http://mx4-quantic-service:8001/railway/plan
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mx4
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
