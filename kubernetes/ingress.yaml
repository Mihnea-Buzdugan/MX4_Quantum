apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mx4-ingress
  namespace: mx4
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    # NGINX Inc controller (nginx-ingress): allow websocket upgrades to Vite (HMR).
    nginx.org/websocket-services: "frontend"
spec:
  ingressClassName: nginx
  rules:
    - host: mx4.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000