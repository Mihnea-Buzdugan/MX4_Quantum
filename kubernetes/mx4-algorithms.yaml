
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mx4-quantic
  namespace: mx4
spec:
  # replicas: managed by the HorizontalPodAutoscaler in hpa.yaml
  selector:
    matchLabels:
      app: mx4-quantic
  template:
    metadata:
      labels:
        app: mx4-quantic
    spec:
      # Let an in-flight solve finish before a scaled-down pod is killed.
      terminationGracePeriodSeconds: 600
      containers:
        - name: mx4-quantic
          image: mx4-quantic:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 4Gi
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]

---
apiVersion: v1
kind: Service
metadata:
  name: mx4-quantic-service
  namespace: mx4
spec:
  selector:
    app: mx4-quantic
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP